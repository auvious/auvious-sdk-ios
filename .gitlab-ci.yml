# On the macOS runner: builds the example app ExampleSimpleConference (and with it
# AuviousSDK) for the iOS simulator, and runs the SDK's XCTests (Tests/) on a simulator.
# No signing, nothing published.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

build-example:
  tags: [macos]
  timeout: 1h
  variables:
    LANG: en_US.UTF-8
  script:
    # CocoaPods' spec cache, kept between jobs but away from the Mac user's own.
    - export PATH="/opt/homebrew/bin:$PATH" CP_HOME_DIR="$HOME/sdk-ios-ci/cocoapods"
    - xcodebuild -version
    - cd Example
    - pod install --repo-update
    # The committed lock must be what pod install resolves (podspec or Podfile changed without it?).
    - git diff --exit-code Podfile.lock || { echo "Podfile.lock is out of date: run pod install in Example/ and commit it"; exit 1; }
    - set -o pipefail
    - >
      xcodebuild -workspace AuviousSDK.xcworkspace -scheme ExampleSimpleConference
      -configuration Debug -destination 'generic/platform=iOS Simulator'
      -derivedDataPath "$CI_PROJECT_DIR/build/DerivedData"
      CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$CI_PROJECT_DIR/build/xcodebuild.log" | grep -E 'error:|BUILD (SUCCEEDED|FAILED)'
  before_script:
    - mkdir -p build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/xcodebuild.log
      - Example/Podfile.lock

test-sdk:
  tags: [macos]
  timeout: 1h
  variables:
    LANG: en_US.UTF-8
  before_script:
    - mkdir -p build
  script:
    - export PATH="/opt/homebrew/bin:$PATH" CP_HOME_DIR="$HOME/sdk-ios-ci/cocoapods"
    - cd Example
    - pod install
    - set -o pipefail
    # The scheme of the podspec's test_spec, hosted in its app_spec TestHost.
    - >
      xcodebuild test -workspace AuviousSDK.xcworkspace -scheme AuviousSDK-Unit-Tests
      -destination 'platform=iOS Simulator,name=iPhone 17'
      -derivedDataPath "$CI_PROJECT_DIR/build/DerivedData" -resultBundlePath "$CI_PROJECT_DIR/build/Tests.xcresult"
      CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$CI_PROJECT_DIR/build/test.log" | grep -E "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)"
  after_script:
    - xcrun simctl shutdown all || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/test.log
      - build/Tests.xcresult
